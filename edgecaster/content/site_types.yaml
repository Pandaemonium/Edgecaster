# Site type definitions for biome-aware POI placement
#
# Each site type defines:
# - Biome affinity (which biomes are suitable)
# - Suitability thresholds (elevation, temperature, moisture, corruption)
# - Placement constraints (spacing, rarity)
# - Content (structures, NPCs, enemies)
# - Display (map glyph and color)

bird_aerie:
  name: "Bird People Aerie"
  primary_biomes: [SNOW, BARE, TUNDRA]
  secondary_biomes: [TEMPERATE_GRASSLAND, SHRUBLAND]
  elevation_min: 0.65
  elevation_max: 1.0
  temperature_min: 0.0
  temperature_max: 0.45
  moisture_min: 0.0
  moisture_max: 0.5
  corruption_max: 0.1
  spacing: 18
  rarity: 0.4
  max_count: 8
  structures: [cliff_tower, nest_platform, open_arena]
  npc_pool: [bird_elder, bird_merchant, bird_scout]
  enemy_pool: [bird_warrior, hunting_hawk]
  map_glyph: "A"
  map_color: [180, 200, 255]

