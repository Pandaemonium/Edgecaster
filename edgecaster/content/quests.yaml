# Quest definitions
# Quests use prototype inheritance system like enemies/entities

- id: quest_base
  name: "Base Quest"
  description: "Base quest template"
  stages: []
  rewards:
    xp: 0

- id: find_the_inventor
  parent: quest_base
  name: "Find the Inventor"
  description: "A local guide pointed you to a brash inventor who might help stabilize a failing seal. Track her down and earn her trust."

  related_npcs:
    - guide_npc
    - inventor_npc

  # Initial locations are provided when quest is accepted
  # (The inventor's location will be added via dialogue)
  initial_locations: []

  stages:
    - stage: 0
      objectives:
        - id: talk_to_inventor
          description: "Travel to the inventor's workshop and speak with her"
          type: dialogue
          target: 1
          params:
            target_npc: inventor_npc
    - stage: 1
      objectives:
        - id: fetch_destabilizer
          description: "Bring the inventor a destabilizer"
          type: collect_item
          target: 1
          params:
            item_type: destabilizer
    - stage: 2
      objectives:
        - id: seal_failing_rune
          description: "Use the coherence crystal to bind the failing rune"
          type: seal_rune
          target: 1
          params:
            trial_id: starter_seal

  rewards:
    xp: 100
