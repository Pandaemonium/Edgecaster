

- id: organism
  name: Organism
  parent: physical_object
  material: organic matter
  description: A living (or once-living) thing made of organic matter.

- id: animal
  name: Animal
  parent: organism
  material: flesh
  description: A mobile organism of flesh.

- id: vertebrate
  name: Vertebrate
  parent: animal
  body_patch:
    - op: add_node
      node: head
      proto: head
      attach_to: body
      layout:
        x: -2
        y: 1
    - op: add_node
      node: tail
      proto: tail
      attach_to: body
      layout:
        x: 2
        y: -1
    - op: replace_node
      node: body
      layout:
        x: 0
        y: 0
      children: [head, tail]
  description: An animal with a head and tail, oriented along a spine.

- id: mammal
  name: Mammal
  parent: vertebrate
  body_patch:
    - op: add_node
      node: forelimb
      proto: limb
      attach_to: body
      layout:
        x: -1
        y: 1
    - op: add_node
      node: forelimb_m
      proto: limb
      attach_to: body
      props:
        mirrored: true
      layout:
        x: -1
        y: 0
    - op: add_node
      node: hindlimb
      proto: limb
      attach_to: body
      layout:
        x: 1
        y: -1
    - op: add_node
      node: hindlimb_m
      proto: limb
      attach_to: body
      props:
        mirrored: true
      layout:
        x: 1
        y: 0
    - op: replace_node
      node: body
      children: [head, tail, forelimb, forelimb_m, hindlimb, hindlimb_m]
  description: A vertebrate with four limbs.

- id: monkey
  name: Monkey
  parent: mammal
  body_patch:
    - op: add_node
      node: arm
      proto: arm
      attach_to: body
      layout:
        x: -1
        y: 1
    - op: add_node
      node: arm_m
      proto: arm
      attach_to: body
      props:
        mirrored: true
      layout:
        x: -1
        y: 0
    - op: add_node
      node: leg
      proto: leg
      attach_to: body
      layout:
        x: 1
        y: -1
    - op: add_node
      node: leg_m
      proto: leg
      attach_to: body
      props:
        mirrored: true
      layout:
        x: 1
        y: 0
    - op: delete_node
      node: forelimb
    - op: delete_node
      node: forelimb_m
    - op: delete_node
      node: hindlimb
    - op: delete_node
      node: hindlimb_m
    - op: replace_node
      node: body
      children: [head, tail, arm, arm_m, leg, leg_m]
  description: A mammal whose forelimbs are arms and hindlimbs are legs.

- id: ape
  name: Ape
  parent: monkey
  body_patch:
    - op: delete_node
      node: tail
    - op: replace_node
      node: body
      children: [head, arm, arm_m, leg, leg_m]
  description: A monkey without a tail.

- id: humanoid
  name: Humanoid
  parent: ape
  body_patch:
    - op: replace_node
      node: head
      layout:
        x: 0
        y: -2
    - op: replace_node
      node: body
      layout:
        x: 0
        y: 0

    - op: replace_node
      node: arm
      layout:
        x: -2
        y: 0
      detail_root: shoulder
    - op: replace_node
      node: arm_m
      layout:
        x: 2
        y: 0
      detail_root: shoulder_m

    - op: add_node
      node: shoulder
      proto: shoulder
      layout: {x: -2.2, y: -0.2}
      children: [upper_arm]
    - op: add_node
      node: upper_arm
      proto: upper_arm
      layout: {x: -2.5, y: 0.5}
      children: [elbow]
    - op: add_node
      node: elbow
      proto: elbow
      layout: {x: -2.7, y: 1.1}
      children: [forearm]
    - op: add_node
      node: forearm
      proto: forearm
      layout: {x: -2.4, y: 1.7}
      children: [hand]
    - op: add_node
      node: hand
      proto: hand
      layout: {x: -2.0, y: 2.3}
      detail_root: wrist

    - op: add_node
      node: wrist
      proto: wrist
      layout: {x: -2.0, y: 2.7}
      children: [palm]
    - op: add_node
      node: palm
      proto: palm
      layout: {x: -2.0, y: 3.2}
      children: [finger_1, finger_2, finger_3, finger_4, finger_5]
    - op: add_node
      node: finger_1
      proto: finger
      layout: {x: -2.4, y: 3.7}
    - op: add_node
      node: finger_2
      proto: finger
      layout: {x: -2.2, y: 3.8}
    - op: add_node
      node: finger_3
      proto: finger
      layout: {x: -2.0, y: 3.85}
    - op: add_node
      node: finger_4
      proto: finger
      layout: {x: -1.8, y: 3.8}
    - op: add_node
      node: finger_5
      proto: finger
      layout: {x: -1.6, y: 3.7}

    - op: add_node
      node: shoulder_m
      proto: shoulder
      props: {mirrored: true}
      layout: {x: 2.2, y: -0.2}
      children: [upper_arm_m]
    - op: add_node
      node: upper_arm_m
      proto: upper_arm
      props: {mirrored: true}
      layout: {x: 2.5, y: 0.5}
      children: [elbow_m]
    - op: add_node
      node: elbow_m
      proto: elbow
      props: {mirrored: true}
      layout: {x: 2.7, y: 1.1}
      children: [forearm_m]
    - op: add_node
      node: forearm_m
      proto: forearm
      props: {mirrored: true}
      layout: {x: 2.4, y: 1.7}
      children: [hand_m]
    - op: add_node
      node: hand_m
      proto: hand
      props: {mirrored: true}
      layout: {x: 2.0, y: 2.3}
      detail_root: wrist_m

    - op: add_node
      node: wrist_m
      proto: wrist
      props: {mirrored: true}
      layout: {x: 2.0, y: 2.7}
      children: [palm_m]
    - op: add_node
      node: palm_m
      proto: palm
      props: {mirrored: true}
      layout: {x: 2.0, y: 3.2}
      children: [finger_1_m, finger_2_m, finger_3_m, finger_4_m, finger_5_m]
    - op: add_node
      node: finger_1_m
      proto: finger
      props: {mirrored: true}
      layout: {x: 2.4, y: 3.7}
    - op: add_node
      node: finger_2_m
      proto: finger
      props: {mirrored: true}
      layout: {x: 2.2, y: 3.8}
    - op: add_node
      node: finger_3_m
      proto: finger
      props: {mirrored: true}
      layout: {x: 2.0, y: 3.85}
    - op: add_node
      node: finger_4_m
      proto: finger
      props: {mirrored: true}
      layout: {x: 1.8, y: 3.8}
    - op: add_node
      node: finger_5_m
      proto: finger
      props: {mirrored: true}
      layout: {x: 1.6, y: 3.7}

    - op: replace_node
      node: leg
      layout:
        x: -1
        y: 2
    - op: replace_node
      node: leg_m
      layout:
        x: 1
        y: 2
  description: A roughly bipedal ape in a paper-doll orientation.


- id: human
  name: Human
  parent: humanoid
  description: Halfway between an ape and an angel.

